<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIP Sucursales - Automatizaciones</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 BIP Sucursales</h1>
            <p class="subtitle">Centro de Control de Automatizaciones</p>
        </div>

        <div class="content">
            <div class="panel">
                <h2>📋 Automatizaciones Disponibles</h2>
                
                <div class="info-box">
                    <p>Selecciona una automatización y sube el archivo Excel requerido antes de ejecutar.</p>
                </div>

                <div class="form-section">
                    <label for="excelFile" class="label">📁 Cargar archivo Excel:</label>
                    <input type="file" id="excelFile" accept=".xlsx,.xls" class="file-input">
                    <span class="file-name" id="fileName">Ningún archivo seleccionado</span>
                </div>

                <div class="buttons-grid">
                    <button class="btn btn-primary" onclick="ejecutar('ALTA_CAJAS_AHORRO')">
                        💾 Alta Cajas de Ahorro
                    </button>
                    <button class="btn btn-primary" onclick="ejecutar('ALTA_CLIENTES')">
                        👤 Alta Clientes
                    </button>
                    <button class="btn btn-primary" onclick="ejecutar('ALTA_MASIVA_TDBS')">
                        🏦 Alta Masiva TDBS
                    </button>
                    <button class="btn btn-primary" onclick="ejecutar('ALTA_PERSONA_HUMANA')">
                        👨 Alta Persona Humana
                    </button>
                    <button class="btn btn-primary" onclick="ejecutar('ALTA_PASIVOS_PAGO')">
                        💳 Alta Pasivos Pago
                    </button>
                    <button class="btn btn-primary" onclick="ejecutar('OP02')">
                        ⚙️ Operación OP02
                    </button>
                    <button class="btn btn-primary" onclick="ejecutar('OP03')">
                        ⚙️ Operación OP03
                    </button>
                    <button class="btn btn-primary" onclick="ejecutar('OP1258')">
                        ⚙️ Operación OP1258
                    </button>
                    <button class="btn btn-primary" onclick="ejecutar('OP1263')">
                        ⚙️ Operación OP1263
                    </button>
                    <button class="btn btn-primary" onclick="ejecutar('OP502')">
                        ⚙️ Operación OP502
                    </button>
                    <button class="btn btn-primary" onclick="ejecutar('OP505')">
                        ⚙️ Operación OP505
                    </button>
                    <button class="btn btn-primary" onclick="ejecutar('OP5400')">
                        ⚙️ Operación OP5400
                    </button>
                    <button class="btn btn-primary" onclick="ejecutar('OP7717')">
                        ⚙️ Operación OP7717
                    </button>
                </div>
            </div>

            <div class="panel">
                <h2>📊 Estado de Ejecución</h2>
                <div id="resultado" class="resultado">
                    <p class="status-idle">Esperando ejecución...</p>
                </div>
                <div id="logs" class="logs">
                    <h3>📝 Logs:</h3>
                    <div class="logs-content" id="logsContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
